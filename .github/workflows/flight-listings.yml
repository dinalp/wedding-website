name: Collect published flight listings

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:
  push:
    branches: [codex/flight-source-pilot]
    paths:
      - '.github/workflows/flight-listings.yml'
      - 'scripts/collect-iwtf.py'

permissions:
  contents: write

concurrency:
  group: published-flight-listings
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LIGHTPANDA_DISABLE_TELEMETRY: 'true'
      LIGHTPANDA_DISABLE_CORE_DUMP: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: flight-data
          path: observations
      - name: Fetch public listings
        run: |
          if [[ "$(date -u +%F)" > "2027-05-19" ]]; then exit 0; fi
          curl --fail --location --retry 2 --output /tmp/lightpanda https://github.com/lightpanda-io/browser/releases/download/1.0.2/lightpanda-x86_64-linux
          echo 'ae7d01d261efb9e480e18ce3424533332883863bcf70b12a4321b5733f37e19e  /tmp/lightpanda' | sha256sum --check
          chmod +x /tmp/lightpanda
          python3 scripts/collect-iwtf.py /tmp/lightpanda observations/quotes.json
      - name: Publish observations and source status
        working-directory: observations
        run: |
          git add quotes.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record published flight listings'
          git push origin HEAD:flight-data
